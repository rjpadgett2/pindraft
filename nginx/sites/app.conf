# app.pindraft.co — ops-console

server {
    listen 80;
    server_name app.pindraft.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.pindraft.co;

    ssl_certificate     /etc/letsencrypt/live/app.pindraft.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.pindraft.co/privkey.pem;

    root /usr/share/nginx/html/ops-console;
    index index.html;

    # Frontend SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Static assets get long cache
    location ~* \.(js|css|woff2|svg|png|jpg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Backend pass-through
    location /api/ {
        proxy_pass http://pindraft_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # OAuth JWKS
    location /.well-known/ {
        proxy_pass http://pindraft_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
    }
}
