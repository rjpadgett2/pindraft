# Production Spring profile. Activate with SPRING_PROFILES_ACTIVE=prod
# or -Dspring.profiles.active=prod.

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true

pindraft:
  bootstrap:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${PINDRAFT_JWT_ISSUER:pindraft}
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 7776000
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  interop:
    consent-url-base: ${PINDRAFT_CONSENT_URL_BASE}

logging:
  level:
    root: INFO
    co.pindraft: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
